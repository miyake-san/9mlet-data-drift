[project]
name = "mlet-data-drift"
version = "0.1.0"
description = "Material didático — Data Drift em Machine Learning (Pós-Graduação FIAP)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scipy>=1.12.0",
    "scikit-learn>=1.5.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "joblib>=1.3.0",
    "jupyterlab>=4.2.0",
    "ipykernel>=6.29.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.7.0",
    "taskipy>=1.14.0",
]
extras = [
    "river>=0.23.0",
    "evidently>=0.7.0",
    "nannyml>=0.13.0",
    "great-expectations>=1.2.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "umap-learn>=0.5.6",
    "spacy>=3.8.0",
    "nltk>=3.9.0",
    "kafka-python>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["01_fundamentos_do_data_drift_em_ml/src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["01_fundamentos_do_data_drift_em_ml/tests"]

[tool.taskipy.tasks]
lint = "ruff check ."
format = "ruff format ."
test = "pytest"