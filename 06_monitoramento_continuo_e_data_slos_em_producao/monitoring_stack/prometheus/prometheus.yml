global:
  scrape_interval: 5s
  evaluation_interval: 5s
  external_labels:
    monitor: "aula6-ml-monitoring"

scrape_configs:
  - job_name: "drift-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["drift-exporter:8000"]
        labels:
          service: "ml-drift-monitor"
          aula: "06"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
